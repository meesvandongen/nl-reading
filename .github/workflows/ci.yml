name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployment is done by Cloudflare Workers Builds (see README), which also
# posts preview URLs on pull requests. This workflow only tests and builds.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so each story gets its "added" date from git
          fetch-depth: 0

      # pnpm comes from the packageManager field in package.json.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dictionary sources (Wiktionary via kaikki.org, OpenSubtitles frequencies).
      # Refreshed weekly; the build is deterministic for the same sources.
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dict-sources-${{ steps.week.outputs.week }}

      - name: Build dictionary
        run: pnpm run data

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Check content
        run: pnpm run audit -- --errors

      - name: Build site
        run: pnpm run build

      - name: Check Worker config
        run: pnpm exec wrangler deploy --dry-run
