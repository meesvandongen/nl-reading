name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployment is done by Cloudflare Workers Builds (see README), which also
# posts preview URLs on pull requests. This workflow only tests and builds.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so each story gets its "added" date from git
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Dictionary sources (Wiktionary via kaikki.org, OpenSubtitles frequencies).
      # Refreshed weekly; the build is deterministic for the same sources.
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dict-sources-${{ steps.week.outputs.week }}

      - name: Build dictionary
        run: npm run data

      - name: Test
        run: npm test

      - name: Check content
        run: npm run audit -- --errors

      - name: Build site
        run: npm run build

      - name: Check Worker config
        run: npx wrangler deploy --dry-run
